version: "3.9"

services:

  # ── Consul (Service Discovery + Config KV) ─────────────────────────────────
  consul:
    image: hashicorp/consul:1.17
    container_name: consul
    command: consul agent -dev -bind=0.0.0.0 -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  # ── Consul KV seeder ────────────────────────────────────────────────────────
  consul-init:
    image: hashicorp/consul:1.17
    container_name: consul-init
    depends_on:
      consul:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export CONSUL_HTTP_ADDR=http://consul:8500
        consul kv put config/hazelcast/hosts "hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701"
        consul kv put config/hazelcast/cluster_name "dev"
        consul kv put config/hazelcast/map_name "logging-messages"
        consul kv put config/mq/hosts "hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701"
        consul kv put config/mq/cluster_name "dev"
        consul kv put config/mq/queue_name "counter-transactions"
        echo "[consul-init] KV store seeded successfully"
    networks:
      - microservices-net
    restart: "no"

  # ── Hazelcast cluster (3 nodes) ────────────────────────────────────────────
  hazelcast-1:
    image: hazelcast/hazelcast:5.3
    container_name: hazelcast-1
    ports:
      - "5701:5701"
    environment:
      - JAVA_OPTS=-Dhazelcast.config=/opt/hazelcast/config_ext/hazelcast.xml
    volumes:
      - ./hazelcast:/opt/hazelcast/config_ext
    networks:
      - microservices-net

  hazelcast-2:
    image: hazelcast/hazelcast:5.3
    container_name: hazelcast-2
    ports:
      - "5702:5701"
    environment:
      - JAVA_OPTS=-Dhazelcast.config=/opt/hazelcast/config_ext/hazelcast.xml
    volumes:
      - ./hazelcast:/opt/hazelcast/config_ext
    networks:
      - microservices-net

  hazelcast-3:
    image: hazelcast/hazelcast:5.3
    container_name: hazelcast-3
    ports:
      - "5703:5701"
    environment:
      - JAVA_OPTS=-Dhazelcast.config=/opt/hazelcast/config_ext/hazelcast.xml
    volumes:
      - ./hazelcast:/opt/hazelcast/config_ext
    networks:
      - microservices-net

  # ── Logging service (3 instances) ─────────────────────────────────────────
  logging-service-1:
    build: ./logging-service
    container_name: logging-service-1
    hostname: logging-service-1
    ports:
      - "8011:8001"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_URL=http://logging-service-1:8001
    depends_on:
      consul:
        condition: service_healthy
      consul-init:
        condition: service_completed_successfully
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started
    networks:
      - microservices-net

  logging-service-2:
    build: ./logging-service
    container_name: logging-service-2
    hostname: logging-service-2
    ports:
      - "8012:8001"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_URL=http://logging-service-2:8001
    depends_on:
      consul:
        condition: service_healthy
      consul-init:
        condition: service_completed_successfully
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started
    networks:
      - microservices-net

  logging-service-3:
    build: ./logging-service
    container_name: logging-service-3
    hostname: logging-service-3
    ports:
      - "8013:8001"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_URL=http://logging-service-3:8001
    depends_on:
      consul:
        condition: service_healthy
      consul-init:
        condition: service_completed_successfully
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started
    networks:
      - microservices-net

  # ── Counter service ────────────────────────────────────────────────────────
  counter-service:
    build: ./counter-service
    container_name: counter-service
    hostname: counter-service
    ports:
      - "8002:8002"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_URL=http://counter-service:8002
    depends_on:
      consul:
        condition: service_healthy
      consul-init:
        condition: service_completed_successfully
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started
    networks:
      - microservices-net

  # ── Facade service ─────────────────────────────────────────────────────────
  facade-service:
    build: ./facade-service
    container_name: facade-service
    hostname: facade-service
    ports:
      - "8000:8000"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_URL=http://facade-service:8000
    depends_on:
      consul:
        condition: service_healthy
      consul-init:
        condition: service_completed_successfully
      logging-service-1:
        condition: service_started
      logging-service-2:
        condition: service_started
      logging-service-3:
        condition: service_started
      counter-service:
        condition: service_started
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
